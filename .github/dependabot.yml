# Weekly update pull requests. Merging one builds nothing by itself: the next bundle request that needs an updated
# package builds it (packages whose build inputs did not change are reused)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # onnxruntime, the EP repositories and AMDMIGraphX: move each submodule to the newest commit of its branch
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    groups:
      submodules:
        patterns: ["*"]
