# Publishes the bundle configurator (site/) on GitHub Pages together with catalog.json (ci/catalog.py), which lists the
# packages of the latest release (or, without releases, of the latest successful build on main).
#
# Settings -> Pages -> Build and deployment -> Source must be "GitHub Actions".

name: pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "ci/catalog.py"
      - "ci/build.py"
      - "ci/matrix.json"
  release:
    types: [published]
  # a finished build changes what the catalog offers when there is no release yet
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # artifacts of the build runs
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate the catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ci/catalog.py --out site/catalog.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
