# Publishes the bundle configurator (site/) on GitHub Pages together with catalog.json (ci/catalog.py), which describes
# the packages the build recipes can build for each target.
#
# Settings -> Pages -> Build and deployment -> Source must be "GitHub Actions".

name: pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "ci/catalog.py"
      - "ci/plan.py"
      - "ci/build.py"
      - "ci/sdk.py"
      - "ci/matrix.json"
      - "scripts/**"
      # submodule updates change the versions the page lists
      - ".gitmodules"
      - "onnxruntime"
      - "eps/**"
      - "deps/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # --versions resolves the third-party SDK versions the page lists (GITHUB_TOKEN: GitHub API requests)
      - name: Generate the catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ci/catalog.py --out site/catalog.json --versions

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
