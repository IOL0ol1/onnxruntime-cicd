# Build ONNX Runtime and all EPs (in-tree EPs, plugin EP repositories, vendor forks) and package
# bin/ lib/ include/ per target triple.
#
# - The build matrix lives in ci/matrix.json and is generated by ci/plan.py (regex filtering, runner overrides
#   through repository variables).
# - Third-party SDKs are downloaded by ci/build.py at build time through scripts/download_ep_packages.py from
#   official sources that need no account; the release packages bundle only the redistributable runtimes.
# - Pushing a v* tag (or a manual run with "publish" checked) publishes all packages as a GitHub Release
#   (publicly downloadable when the repository is public).
#
# Optional repository variables (Settings -> Variables):
#   RUNNER_MAP          JSON that replaces default runners, e.g. {"ubuntu-24.04": "linux-8core"}
#   HEAVY_RUNNER_MAP    JSON that replaces runners only for long builds such as CUDA / QNN
#   CUDA_ARCHITECTURES  default CMAKE_CUDA_ARCHITECTURES (a manual run input overrides it)
#   MIGRAPHX_GPU_TARGETS  GPU_TARGETS of the Windows MIGraphX source build (default gfx1100;gfx1101;gfx1102;gfx1200;gfx1201)

name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "ci/**"
      - "scripts/**"
      - ".gitmodules"
      - "onnxruntime"
      - "eps/**"
  workflow_dispatch:
    inputs:
      filter:
        description: "Only build entries whose package or package/triple matches this regex (empty = all), e.g. ep-qnn|wasm"
        type: string
        default: ""
      cuda_archs:
        description: "CMAKE_CUDA_ARCHITECTURES (default 80-real;80-virtual: SM 8.0 SASS plus a compute_80 PTX, JIT-compiled on newer GPUs)"
        type: string
        default: ""
      publish:
        description: "Publish a GitHub Release when the build succeeds"
        type: boolean
        default: false
      force_rebuild:
        description: "Build every entry, even those whose inputs match an earlier run's package"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read  # the plan job looks up, and the build jobs download, packages of earlier runs with the same inputs

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # ORT drops a list that has only -virtual entries, so keep at least one real architecture
  CUDA_ARCHITECTURES: ${{ inputs.cuda_archs || vars.CUDA_ARCHITECTURES || '80-real;80-virtual' }}
  # GPU targets of the Windows MIGraphX source build (empty = ci/build.py default: RDNA3 / RDNA4)
  MIGRAPHX_GPU_TARGETS: ${{ vars.MIGRAPHX_GPU_TARGETS }}
  CMAKE_VERSION: "4.2.3"
  # CMake 4 removed compatibility with cmake_minimum_required(VERSION < 3.5), still used by some ORT dependencies
  # (psimd, oneDNN)
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: plan
        run: python ci/plan.py
        env:
          FILTER: ${{ inputs.filter }}
          RUNNER_MAP: ${{ vars.RUNNER_MAP }}
          HEAVY_RUNNER_MAP: ${{ vars.HEAVY_RUNNER_MAP }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: plan
    name: ${{ matrix.package }} · ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}  # authenticated GitHub API requests (the anonymous rate limit is easily hit)
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && matrix.reuse_run == ''
        run: bash ci/free_disk.sh "${{ matrix.keep_android_sdk }}"

      - name: Check out required submodules
        if: matrix.reuse_run == ''
        run: |
          for path in ${{ matrix.submodules }}; do
            git submodule update --init --depth 1 "$path"
            git -C "$path" submodule update --init --recursive --depth 1
          done

      # qcom/build_and_test.py of onnxruntime-qnn creates its venv with python3.10 on Linux hosts
      - uses: actions/setup-python@v7
        if: matrix.recipe == 'ep-qnn' && runner.os == 'Linux' && matrix.reuse_run == ''
        with:
          python-version: "3.10"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        if: matrix.reuse_run == ''
        # jinja2 / MarkupSafe: Dawn's code generator falls back to these when its own fetched copies come back empty
        run: python -m pip install --upgrade "cmake==${CMAKE_VERSION}" ninja jinja2 markupsafe

      - name: Install system packages (Linux)
        if: runner.os == 'Linux' && matrix.apt != '' && matrix.docker == '' && matrix.reuse_run == ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows' && matrix.reuse_run == ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          # The image also ships the VS 2022 toolset: CUDA 12 does not accept the VS 2026 compiler (MSVC 14.5x), and the
          # constexpr <cmath> comparisons of its STL clash with the HIP device overloads when building MIGraphX
          toolset: ${{ (matrix.cuda_major == '12' || matrix.recipe == 'ep-amdgpu') && '14.44' || '' }}

      - name: Remove Git Bash link.exe (it shadows the MSVC linker)
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe

      - name: Set paths
        run: |
          {
            echo "WORK_DIR=${RUNNER_TEMP}/work"
            echo "STAGE_DIR=${RUNNER_TEMP}/stage"
            echo "SDK_ROOT=${RUNNER_TEMP}/sdk"
            echo "DIST_DIR=${RUNNER_TEMP}/dist"
            # Default for `cmake --build` without --parallel (an explicit bare --parallel ignores it); a Makefile
            # build would otherwise run serially. Linux only: with the Xcode generator it adds a second -jobs option,
            # which xcodebuild rejects.
            if [ "$RUNNER_OS" = "Linux" ]; then echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)"; fi
          } >> "$GITHUB_ENV"

      # Long-running, open-source build steps (see build_cache in ci/build.py) are reused across runs. The key hashes
      # their inputs, so an update gets a new key; only complete results are saved.
      - name: Build cache key
        id: cache
        if: matrix.docker == '' && matrix.reuse_run == ''
        run: >-
          python ci/build.py --recipe "${{ matrix.recipe }}" --variant "${{ matrix.variant }}" --triple "${{ matrix.triple }}"
          --cuda-major "${{ matrix.cuda_major }}" --work "$WORK_DIR" --stage "$STAGE_DIR" --sdk-root "$SDK_ROOT"
          --cache-info "$GITHUB_OUTPUT"

      - name: Restore build cache
        id: restore
        if: steps.cache.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.cache.outputs.key }}
          path: ${{ steps.cache.outputs.path }}

      - name: Build
        if: matrix.docker == '' && matrix.reuse_run == ''
        run: >-
          python ci/build.py --recipe "${{ matrix.recipe }}" --variant "${{ matrix.variant }}" --triple "${{ matrix.triple }}"
          --cuda-major "${{ matrix.cuda_major }}" --work "$WORK_DIR" --stage "$STAGE_DIR" --sdk-root "$SDK_ROOT"

      # Saved even when a later build step fails, as long as the cached step itself finished
      - name: Check build cache
        id: cache-check
        if: always() && steps.cache.outputs.key != '' && steps.restore.outputs.cache-hit != 'true'
        run: if [ -f "${{ steps.cache.outputs.path }}/${{ steps.cache.outputs.marker }}" ]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save build cache
        if: always() && steps.cache-check.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache.outputs.key }}
          path: ${{ steps.cache.outputs.path }}

      - name: Build (container ${{ matrix.docker }})
        if: matrix.docker != '' && matrix.reuse_run == ''
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" \
            -e CUDA_ARCHITECTURES -e PYTHONUTF8 -e PYTHONIOENCODING -e CMAKE_VERSION -e CMAKE_POLICY_VERSION_MINIMUM \
            -e CMAKE_BUILD_PARALLEL_LEVEL -e GITHUB_TOKEN \
            "${{ matrix.docker }}" bash -c '
              set -euo pipefail
              apt-get update && apt-get install -y --no-install-recommends python3-pip python3-venv git patch ${{ matrix.apt }}
              git config --global --add safe.directory "*"
              python3 -m pip install --break-system-packages "cmake==${CMAKE_VERSION}" ninja
              python3 ci/build.py --recipe "${{ matrix.recipe }}" --variant "${{ matrix.variant }}" \
                --triple "${{ matrix.triple }}" --work "'"$WORK_DIR"'" --stage "'"$STAGE_DIR"'" --sdk-root "'"$SDK_ROOT"'"
            '
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      # Inputs unchanged since an earlier run (see add_reuse in ci/plan.py): repackage its package instead of building
      - name: Download the package of run ${{ matrix.reuse_run }}
        if: matrix.reuse_run != ''
        uses: actions/download-artifact@v8
        with:
          name: pkg-${{ matrix.id }}
          run-id: ${{ matrix.reuse_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reuse

      - name: Package
        run: >-
          python ci/package.py --stage "$STAGE_DIR" --name "${{ matrix.package }}" --triple "${{ matrix.triple }}"
          --version "${{ needs.plan.outputs.version }}" --source ${{ matrix.submodules }}
          --sdk-versions "$SDK_ROOT/sdk-versions.json" --out "$DIST_DIR"
          --extra "cuda_architectures=${CUDA_ARCHITECTURES}" "cuda_major=${{ matrix.cuda_major }}"
          "recipe=${{ matrix.recipe }}/${{ matrix.variant }}"
          ${{ matrix.reuse_run != '' && '--from-archive "$RUNNER_TEMP/reuse"' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.id }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          compression-level: 0

      # Marks this package as built from these inputs, so later runs with the same inputs can reuse it
      - name: Record the build inputs
        run: echo "${{ matrix.inputs_artifact }}" > "$RUNNER_TEMP/inputs.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.inputs_artifact }}
          path: ${{ runner.temp }}/inputs.txt

  release:
    needs: [plan, build]
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums and release notes
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          {
            echo "## onnxruntime-cicd ${{ needs.plan.outputs.version }}"
            echo
            echo "ONNX Runtime and Execution Provider builds packaged per target triple (bin/ lib/ include/)."
            echo "BUILD_INFO.json in each package records the source commits and the third-party SDK versions used."
            echo
            echo "> Redistributable third-party runtimes (oneDNN, DirectML, OpenVINO, QAIRT, TensorRT for RTX, MIGraphX, ...) are"
            echo "> bundled with their licenses in third_party_licenses/. The CUDA libraries, cuDNN, TensorRT and CANN are not: use"
            echo "> scripts/fetch_ep_runtime.py --package-dir <extracted package> from this repository, which downloads the"
            echo "> versions recorded in BUILD_INFO.json and extracts only the runtime files. ROCm is a system installation."
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in *.tar.gz *.zip; do
              [ -e "$f" ] && echo "| \`$f\` | $(du -h "$f" | cut -f1) |"
            done
          } > ../RELEASE_NOTES.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          prerelease=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "" || echo "--prerelease")
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "onnxruntime-cicd ${{ needs.plan.outputs.version }}" --notes-file RELEASE_NOTES.md $prerelease
