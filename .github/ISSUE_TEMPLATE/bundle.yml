name: Bundle request
description: Build an ONNX Runtime bundle with the selected EPs (create it from the configurator page)
title: "[bundle] "
labels: ["bundle"]
body:
  - type: markdown
    attributes:
      value: |
        Create this request from the [configurator page](https://iol0ol1.github.io/onnxruntime-cicd/), which fills in
        the configuration. Builds run only for collaborators of this repository; the bundle is linked in this issue
        when it is ready.
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Generated by the configurator page. Edit it there and create a new request instead of changing it here.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: licenses
    attributes:
      label: Third-party licenses
      description: The configurator page lists the licenses of the third-party components of this selection.
      options:
        - label: >-
            I have read the licenses of the third-party components of this selection and accept them for the files
            the bundle contains and the files its fetch-restricted script downloads.
          required: true
